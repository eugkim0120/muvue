.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 68px); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 30; pointer-events: none; }

  .app { flex-direction: row; }

  .sidebar { display: flex; flex-direction: column; width: var(--sidebar-w); flex: none; border-right: 1px solid var(--border); background: var(--surface); padding: 12px; gap: 8px; position: sticky; top: 0; height: 100dvh; }

/* dashboard/src/canvas/canvas.css */
.canvas-wrap { position: relative; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-2); padding-bottom: 60px; }

.canvas-arrows .dag-arrowhead { fill: var(--text-2); }
.canvas-arrows .arrow-label-bg { fill: var(--surface); stroke: var(--text-2); }
.canvas-arrows .arrow-label { font-size: 13px; fill: var(--text); }
.canvas-zoom-controls { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
.spec-root-card, .task-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px 12px; cursor: pointer; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; gap: 4px; }

.clamp-1, .clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp-1 { -webkit-line-clamp: 1; } .clamp-2 { -webkit-line-clamp: 2; }
.dag-empty { border-style: dashed; border-left-width: 1px; cursor: default; background: color-mix(in srgb, var(--surface) 70%, transparent); }
/* Inside a fixed-height box nothing may widen or push past the box: the chip
   wraps instead of running off the right edge and sits at the box's bottom,
   and a long subtask title ends in an ellipsis rather than growing its row. */
.task-box .subtask-list { margin: 0; }
.task-box .subtask-row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dag-skeleton { height: 10px; border-radius: 5px; background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
.task-box.st-bar-ready { border-left-color: var(--st-ready); }
.task-box.st-bar-in_progress { border-left-color: var(--st-in_progress); }
.task-box.st-bar-review { border-left-color: var(--st-review); }
.task-box.st-bar-done { border-left-color: var(--st-done); }
.task-box.st-bar-blocked, .task-box.st-bar-failed { border-left-color: var(--st-blocked); }
.task-box:focus-visible, .spec-root-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.purpose { margin: 2px 0 6px; }
.subtask-list { display: flex; flex-direction: column; margin: 4px 0; }

.more-row { padding-left: 20px; }
.needs-you-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
@keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.project-grid { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "rail" "dag"; }
.project-head { grid-area: head; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 8px; min-width: 0; }
.project-head .page-title { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
.project-rail { grid-area: rail; display: flex; flex-direction: column; min-width: 0; }
.project-dag { grid-area: dag; padding: 0 16px 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.meta-row { gap: 8px; }
.toolbar { gap: 8px; }
.toolbar .caption { flex: 1 1 7rem; min-width: 0; line-height: 1.25; }
.status-line { padding: 0; }

@media (max-width: 899px) {
  .project-head .page-title, .project-menu-btn { display: none; }
}
@media (min-width: 1100px) {
  .project-grid { grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "head rail" "dag rail"; align-items: start; }

.task-box.st-bar-blocked { background: color-mix(in srgb, var(--st-blocked) 8%, var(--surface)); }

.progress-line, .reason { margin: 0; }
