schema_version = 1
protocol_version = 2
mode = "light"
worktree_mode = "branch"
worktree_setup = "uv sync"

[checks]
test = "pytest -q"
lint = ""

[risk]
globs = ["migrations/**", "auth/**", "*.sql", "**/test_*"]
max_diff_lines = 300

[planning]
max_files_per_task = 8
max_subtasks = 6
ask_timeout_minutes = 60
lease_minutes = 60

[notify]
url = ""

[budget]
max_wall_clock_minutes = 240
max_nodes_per_run = 20

[agents.fake]
command = "muvue-fake-agent"
cost_model = "tokens"

[routing]
spec = "fake"
task = "fake"
subtask = "fake"
