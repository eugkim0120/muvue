[project]
name = "muvue"
version = "0.2.1"
description = "A CLI and live dashboard for working with AI coding agents through a plan you can see and approve, instead of a chat transcript"
readme = "README.md"
authors = [
    { name = "Eugene Kim", email = "eugkim0120@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]
license = "MIT"
keywords = ["ai-agents", "cli", "orchestration", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/eugkim0120/muvue"
Repository = "https://github.com/eugkim0120/muvue"

[project.scripts]
muvue = "muvue.cli.main:main"
muvue-fake-agent = "muvue.fake_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["muvue.core"]

[tool.coverage.report]
# v4 section 10: coverage target 85% on muvue.core. Enforced whenever
# pytest runs with --cov (CI always does).
fail_under = 85
