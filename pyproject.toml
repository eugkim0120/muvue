[project]
name = "muvue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eugene Kim", email = "eugkim0120@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
