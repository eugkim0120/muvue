name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Git identity for the tests' throwaway repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: scripts/check.sh (tests with the 85% coverage gate, hook latency, dashboard, extension unit tests)
        run: scripts/check.sh

  vscode-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: .
      - name: P8 acceptance in a real VS Code Extension Host, against a live daemon
        run: xvfb-run -a npm run test:host
        env:
          MUVUE_CMD: uv run --project ${{ github.workspace }} muvue
